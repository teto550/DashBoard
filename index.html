<style>

input[type=text],input[type=email],input[type=password],input[type=search],input[type=datetime-local],select{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0;max-width:100%}

table.t{width:100%;border-collapse:collapse;font-size:.88rem}
table.t th,table.t td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right}

.sub{font-size:.82rem;color:var(--muted)} .sub2{font-size:.86rem;margin-top:3px}
.todo{display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.todo:last-child{border-bottom:0} .todo .grow{font-size:.92rem}

ol.steps{padding-inline-start:20px;margin:8px 0} ol.steps li{margin:6px 0}
/* مودال */
.ov{position:fixed;inset:0;background:rgba(2,6,23,.65);z-index:60;display:flex;align-items:center;justify-content:center;padding:14px}

<body>
<div id="app"><div class="empty"><span class="spin"></span>جاري التحميل…</div></div>
<div id="toast"></div>
<div id="modal"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { initializeAppCheck, ReCaptchaEnterpriseProvider } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app-check.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, getDocs, getCountFromServer, query, where, orderBy, limit, startAfter, updateDoc, deleteDoc, arrayRemove, arrayUnion, Timestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ================= الإعدادات ================= */
const SESSION_GAP_MIN = 15, SESSION_PAD_MIN = 2;   // تقدير الوقت من سجل الأنشطة (للفترات القديمة قبل القياس الحقيقي)
const PAGE = 1000, MAX_LOGS = 4000;
const SERVANTS_CLASS_ID = '__servants__';
const PRIMARY_ADMINS = ['devidemele@gmail.com'];
const WEEKDAYS = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];

const SERVICES = {
  hdour: {
    id:'hdour', title:'خدمة ابتدائي', sub:'Hdour', emoji:'🧒', acc:'#60a5fa', fem:false, wMany:'الخدام', wOne:'خادم', supervisors:true,
    cfg:{ apiKey:"AIzaSyBWK4y1GjEBXMrzgKu3Hm3sSG5sd2ympEI", authDomain:"hdour-d66d8.firebaseapp.com", projectId:"hdour-d66d8",
          storageBucket:"hdour-d66d8.firebasestorage.app", messagingSenderId:"877333539513", appId:"1:877333539513:web:5e36ff0a09a2924ae64968" },
    rc:'6LfZEcYtAAAAAPAX04C1QJAGkoB1MV8MbJuNRF2a', worker:'https://hdour-push.devidemele.workers.dev'
  },
  e3taty: {
    id:'e3taty', title:'خدمة إعدادي', sub:'E3taty', emoji:'👧', acc:'#f472b6', fem:true, wMany:'الخادمات', wOne:'خادمة', supervisors:false,
    cfg:{ apiKey:"AIzaSyCluCLDVy4ojnqI4XFCbsRFL8gH1GKjnzI", authDomain:"e3taty.firebaseapp.com", projectId:"e3taty",
          storageBucket:"e3taty.firebasestorage.app", messagingSenderId:"759314140537", appId:"1:759314140537:web:f27c8bedfc06ad13b373a8" },
    rc:'6Le_8uktAAAAACBWXqGADoPshcKYYGh2Fv22tdd4', worker:'https://e3taty-push.devidemele.workers.dev'
  }
};

const isLocal = ['localhost','127.0.0.1','::1'].includes(location.hostname);
for (const s of Object.values(SERVICES)) {
  s.app = initializeApp(s.cfg, 'dash-' + s.id);
  if (!isLocal) { try { initializeAppCheck(s.app, { provider:new ReCaptchaEnterpriseProvider(s.rc), isTokenAutoRefreshEnabled:true }); } catch(e) { console.warn('appcheck', s.id, e); } }
  s.auth = getAuth(s.app);
  s.db = getFirestore(s.app);
  s.user = null; s.admin = false; s.authError = '';
  s.servants = []; s.servantsLoaded = false; s.classes = new Map(); s.roles = new Map();
  s.logs = []; s.logsKey = ''; s.logsCapped = false;
  s.usage = []; s.usageKey = ''; s.stats = new Map(); s.statsSource = 'usage'; s.trackStart = '';
  s.requests = []; s.pending = null; s.summary = null; s.att = null;
  s.period = { preset:'30', from:'', to:'' };
  s.ui = { tab:'servants', sort:'usage', q:'', role:'', cls:'', status:'', expanded:null, actServant:'', actAction:'', actQ:'', actShown:200, busy:{} };
}

/* ================= أدوات ================= */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LOC = 'ar-EG-u-nu-latn';
const fmtDate = d => d ? d.toLocaleDateString(LOC, { weekday:'long', day:'numeric', month:'long', year:'numeric' }) : '—';
const fmtShortDate = d => d ? d.toLocaleDateString(LOC, { day:'numeric', month:'short', year:'numeric' }) : '—';
const fmtTime = d => d ? d.toLocaleTimeString(LOC, { hour:'2-digit', minute:'2-digit', hour12:true }) : '';
const fmtDateTime = d => d ? fmtShortDate(d) + ' — ' + fmtTime(d) : '—';
const fmtDur = m => { m = Math.round(m); if (m < 1) return '—'; if (m < 60) return m + ' د'; const h = Math.floor(m/60), r = m % 60; return h + ' س' + (r ? ' ' + r + ' د' : ''); };
const toDate = t => t && typeof t.toDate === 'function' ? t.toDate() : (t instanceof Date ? t : null);
const p2 = n => String(n).padStart(2, '0');
const dayStr = d => d.getFullYear() + '-' + p2(d.getMonth()+1) + '-' + p2(d.getDate());
const dayDate = str => new Date(str + 'T12:00:00');
const addDays = (str, n) => { const d = dayDate(str); d.setDate(d.getDate() + n); return dayStr(d); };
const toInputDT = d => d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+'T'+p2(d.getHours())+':'+p2(d.getMinutes());
const isPrimary = email => PRIMARY_ADMINS.includes(String(email || '').toLowerCase());

function toast(msg, err) {
  const el = document.createElement('div'); if (err) el.className = 'err'; el.textContent = msg;
  $('#toast').appendChild(el); setTimeout(() => el.remove(), 3800);
}
function authMsg(e) {
  const c = e && e.code || '';
  if (/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c)) return 'الإيميل أو الباسورد غلط';
  if (/too-many-requests/.test(c)) return 'محاولات كتير — استنى شوية وجرّب تاني';
  if (/network/.test(c)) return 'مشكلة في الإنترنت';
  return 'تعذّر تسجيل الدخول' + (c ? ' (' + c + ')' : '');
}
function csvCell(v) {
  v = String(v ?? '');
  if (/^[=+\-@\t\r]/.test(v) && !/^[+\-]?\d[\d\s().-]*$/.test(v)) v = "'" + v;
  return '"' + v.replace(/"/g, '""') + '"';
}
function downloadCSV(name, rows) {
  const blob = new Blob(['﻿' + rows.map(r => r.map(csvCell).join(',')).join('\r\n')], { type:'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}

/* ================= الدخول والتحقق من الأدمن ================= */
async function verifyAdmin(s, user) {
  try {
    const snap = await getDoc(doc(s.db, 'servants', user.uid));
    const d = snap.exists() ? snap.data() : null;
    return !!(d && d.status === 'approved' && d.role === 'admin');
  } catch (e) { console.error('verifyAdmin', s.id, e); return false; }
}
function watchAuth(s) {
  return new Promise(res => {
    let first = true;
    onAuthStateChanged(s.auth, async user => {
      if (user) {
        const ok = await verifyAdmin(s, user);
        if (ok) { s.user = user; s.admin = true; s.authError = ''; }
        else { s.user = null; s.admin = false; s.authError = 'الحساب ده مش أدمن معتمد في ' + s.title; try { await signOut(s.auth); } catch(_){} }
      } else { s.user = null; s.admin = false; }
      if (first) { first = false; res(); } else if (state.v === 'home') renderHome();
    });
  });
}

/* ================= تحميل البيانات ================= */
async function loadBase(s, force) {
  if (s.servantsLoaded && !force) return;
  const [cs, rs, ss] = await Promise.all([
    getDocs(collection(s.db, 'classes')),
    getDocs(collection(s.db, 'roles')).catch(() => null),
    getDocs(collection(s.db, 'servants'))
  ]);
  s.classes = new Map(cs.docs.map(d => [d.id, { id:d.id, ...d.data() }]));
  s.roles = new Map(rs ? rs.docs.map(d => [d.id, { id:d.id, ...d.data() }]) : []);
  s.servants = ss.docs.map(d => ({ id:d.id, ...d.data() }));
  s.servantsLoaded = true;
}
function periodRange(s) {
  const p = s.period, now = new Date();
  const sod = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const end = new Date(now.getTime() + 60000);
  if (p.preset === 'today') return [sod(now), end];
  if (p.preset === 'custom') { const f = p.from ? new Date(p.from) : null, t = p.to ? new Date(p.to) : null; return [f || new Date(2020,0,1), t || end]; }
  if (p.preset === 'all') return [new Date(2020,0,1), end];
  const n = +p.preset || 30; const st = sod(now); st.setDate(st.getDate() - (n - 1));
  return [st, end];
}
function periodDays(s) { const [a, b] = periodRange(s); return [dayStr(a), dayStr(new Date(b.getTime() - 60000))]; }
function periodText(s) { const [a, b] = periodRange(s); return fmtShortDate(a) + ' ← ' + fmtShortDate(new Date(b.getTime() - 60000)); }

/* ----- سجل الأنشطة (قراءة تقيلة: بنحمّله بس في تبويب الأنشطة أو لو القياس لسه ما بدأش) ----- */
async function loadLogs(s, force) {
  const [a, b] = periodRange(s), key = a.getTime() + '_' + b.getTime();
  if (!force && s.logsKey === key) return;
  const out = []; let last = null, capped = false;
  while (true) {
    const parts = [collection(s.db, 'activityLog'), where('timestamp','>=',Timestamp.fromDate(a)), where('timestamp','<',Timestamp.fromDate(b)), orderBy('timestamp','desc')];
    if (last) parts.push(startAfter(last));
    parts.push(limit(PAGE));
    const snap = await getDocs(query(...parts));
    snap.docs.forEach(d => { const x = d.data(); out.push({ id:d.id, uid:x.uid || '', name:x.name || '', action:x.action || '', detail:x.detail || '', ts:toDate(x.timestamp) || new Date(0) }); });
    if (snap.size < PAGE) break;
    last = snap.docs[snap.docs.length - 1];
    if (out.length >= MAX_LOGS) { capped = true; break; }
  }
  s.logs = out; s.logsKey = key; s.logsCapped = capped;
}
function statsFromLogs(logs) {
  const by = new Map();
  for (const l of logs) { const k = l.uid || ('n:' + l.name); if (!by.has(k)) by.set(k, []); by.get(k).push(l); }
  const stats = new Map();
  for (const [k, arr] of by) {
    arr.sort((x, y) => x.ts - y.ts);
    let minutes = 0, sessions = 0, start = arr[0].ts.getTime(), prev = start, opens = 0;
    const days = new Set(), actions = new Map();
    for (const l of arr) {
      const t = l.ts.getTime();
      if ((t - prev) / 60000 > SESSION_GAP_MIN) { minutes += (prev - start) / 60000 + SESSION_PAD_MIN; sessions++; start = t; }
      prev = t; days.add(dayStr(l.ts)); actions.set(l.action, (actions.get(l.action) || 0) + 1);
      if (l.action === 'فتح التطبيق') opens++;
    }
    minutes += (prev - start) / 60000 + SESSION_PAD_MIN; sessions++;
    stats.set(k, { work:arr.length - opens, opens, minutes, sessions, days:days.size, last:arr[arr.length - 1].ts, actions });
  }
  return stats;
}

/* ----- القياس الحقيقي: مستند يومي لكل خادم (usage) + كاش محلي للأيام اللي فاتت ----- */
const ucKey = s => 'dash_usage_v1_' + s.id;
function ucRead(s) { try { const c = JSON.parse(localStorage.getItem(ucKey(s))); if (c && c.docs && c.from && c.through) return c; } catch (_) {} return null; }
function ucWrite(s, c) { try { localStorage.setItem(ucKey(s), JSON.stringify(c)); } catch (_) {} }
async function fetchUsage(s, from, to, single) {
  const q = single
    ? query(collection(s.db, 'usage'), where('day', '==', from))
    : query(collection(s.db, 'usage'), where('day', '>=', from), where('day', '<=', to));
  const snap = await getDocs(q);
  return snap.docs.map(d => { const x = d.data(); return [d.id, x.uid || '', x.name || '', x.day || '', +x.seconds || 0, +x.acts || 0, +x.opens || 0, (toDate(x.last) || new Date(0)).getTime()]; });
}
// الأيام اللي فاتت بتتجاب مرة واحدة وتتخزن؛ النهارده بيتجاب طازة كل مرة
async function getUsageRows(s, aDay, bDay, force) {
  const today = dayStr(new Date()), yest = addDays(today, -1);
  const wantFrom = aDay > yest ? yest : aDay;
  let c = force ? null : ucRead(s);
  if (!c) {
    c = { from:wantFrom, through:yest, docs:{} };
    (await fetchUsage(s, wantFrom, yest)).forEach(r => { c.docs[r[0]] = r; });
  } else {
    if (wantFrom < c.from) { (await fetchUsage(s, wantFrom, addDays(c.from, -1))).forEach(r => { c.docs[r[0]] = r; }); c.from = wantFrom; }
    if (c.through < yest) { (await fetchUsage(s, addDays(c.through, 1), yest)).forEach(r => { c.docs[r[0]] = r; }); c.through = yest; }
  }
  ucWrite(s, c);
  const rows = Object.values(c.docs).filter(r => r[3] >= aDay && r[3] <= bDay);
  if (bDay >= today) rows.push(...await fetchUsage(s, today, today, true));
  return rows;
}
async function loadUsage(s, force) {
  const [aDay, bDay] = periodDays(s), key = aDay + '_' + bDay;
  if (!force && s.usageKey === key) return;
  s.usage = await getUsageRows(s, aDay, bDay, force);
  s.usageKey = key;
  s.trackStart = s.usage.reduce((m, r) => (!m || r[3] < m) ? r[3] : m, '');
}
function statsFromUsage(rows) {
  const m = new Map();
  for (const r of rows) {
    const [, uid, name, day, sec, acts, opens, last] = r;
    let o = m.get(uid); if (!o) { o = { work:0, opens:0, minutes:0, sessions:null, days:0, last:null, actions:null }; m.set(uid, o); }
    o.work += acts; o.opens += opens; o.minutes += sec / 60;
    if (sec > 0 || acts > 0 || opens > 0) o.days++;
    const t = last || dayDate(day).getTime();
    if (!o.last || t > o.last.getTime()) o.last = new Date(t);
  }
  return m;
}
async function ensureStats(s, force) {
  await loadUsage(s, force);
  if (s.usage.length) { s.stats = statsFromUsage(s.usage); s.statsSource = 'usage'; }
  else { await loadLogs(s, force); s.stats = statsFromLogs(s.logs); s.statsSource = 'logs'; }
}

async function loadSummary(s) {
  try {
    await loadBase(s);
    const today = dayStr(new Date()), from = addDays(today, -6);
    const rows = await getUsageRows(s, from, today);
    const active = new Set(rows.filter(r => r[4] > 0 || r[5] > 0 || r[6] > 0).map(r => r[1]));
    const people = s.servants.filter(v => v.status === 'approved' && v.role !== 'admin');
    s.summary = { total:people.length, tracking:rows.length > 0, active:people.filter(v => active.has(v.id)).length, minutes:rows.reduce((n, r) => n + r[4], 0) / 60 };
  } catch (e) { console.warn('summary', s.id, e); s.summary = null; }
  try { const r = await getCountFromServer(query(collection(s.db, 'servants'), where('status', '==', 'pending'))); s.pending = r.data().count; } catch (e) { s.pending = null; }
}
async function loadRequests(s) {
  const snap = await getDocs(query(collection(s.db, 'servants'), where('status', '==', 'pending')));
  s.requests = snap.docs.map(d => ({ id:d.id, ...d.data() })).sort((a, b) => (toDate(b.createdAt)?.getTime() || 0) - (toDate(a.createdAt)?.getTime() || 0));
  s.pending = s.requests.length;

function servantsData(s) {

  if (ui.cls) list = list.filter(v => classIds(v.assignedClass).includes(ui.cls));
  if (ui.status) list = list.filter(v => {
    const st = statFor(s, v), idle = d => idleDays(st) >= d;
    if (ui.status === 'active') return !!st;
    if (v.role === 'admin') return false; // الأدمن مش بيتحسب خامل
    return ui.status === 'never' ? !st : ui.status === 'idle7' ? idle(7) : idle(14);
  });
  const z = { work:0, opens:0, minutes:0, last:null }, g = v => statFor(s, v) || z;
  const sorters = {
    usage: (a, b) => g(b).work - g(a).work || g(b).opens - g(a).opens || g(b).minutes - g(a).minutes,
    time: (a, b) => g(b).minutes - g(a).minutes || g(b).work - g(a).work,

}

function barChart(items) {
  if (!items.length) return '';
  const max = Math.max(1, ...items.map(i => i.value));
  return `<div class="chart">${items.map(i => `<div class="col" title="${esc(i.title)}"><div class="bar2 ${i.value ? '' : 'z'}" style="height:${Math.max(2, Math.round(i.value / max * 100))}%"></div></div>`).join('')}</div>
    <div class="axis"><span>${esc(items[0].label)}</span><span>${esc(items[items.length - 1].label)}</span></div>`;
}
function analysisView(s) {
  const rows = s.usage;
  if (!rows.length) return `<div class="empty">لسه مفيش بيانات قياس في الفترة دي.<div class="note">القياس بيبدأ يتسجل أول ما الخدام يفتحوا النسخة الجديدة من البرنامج، وتنشر قواعد Firestore الجديدة (usage). <a class="link" data-act="setupHelp" data-s="${s.id}">إزاي أشغّله؟</a></div></div>`;
  const today = dayStr(new Date()), [aDay0, bDay0] = periodDays(s);
  const first = rows.reduce((m, r) => r[3] < m ? r[3] : m, rows[0][3]);
  const aDay = first > aDay0 ? first : aDay0, bDay = bDay0 > today ? today : bDay0;
  const byDay = new Map();
  for (const r of rows) {
    let o = byDay.get(r[3]); if (!o) { o = { min:0, acts:0, users:new Set() }; byDay.set(r[3], o); }
    o.min += r[4] / 60; o.acts += r[5]; if (r[4] > 0 || r[5] > 0 || r[6] > 0) o.users.add(r[1]);
  }
  const days = []; for (let d = aDay, n = 0; d <= bDay && n < 4000; d = addDays(d, 1), n++) days.push(d);
  const weekly = days.length > 62;
  const buckets = new Map();
  for (const d of days) {
    let key = d; if (weekly) { const dt = dayDate(d); key = addDays(d, -((dt.getDay() + 1) % 7)); }
    let b = buckets.get(key); if (!b) { b = { users:new Set(), min:0, acts:0 }; buckets.set(key, b); }
    const o = byDay.get(d); if (o) { o.users.forEach(u => b.users.add(u)); b.min += o.min; b.acts += o.acts; }
  }
  const lab = k => dayDate(k).toLocaleDateString(LOC, { day:'numeric', month:'short' });
  const bl = [...buckets.entries()];
  const usersItems = bl.map(([k, b]) => ({ label:lab(k), value:b.users.size, title:`${lab(k)}${weekly ? ' (أسبوع)' : ''}: ${b.users.size} نشطين` }));
  const minItems = bl.map(([k, b]) => ({ label:lab(k), value:Math.round(b.min), title:`${lab(k)}: ${fmtDur(b.min)}` }));
  const allUsers = new Set(); let tMin = 0, tActs = 0;
  byDay.forEach(o => { o.users.forEach(u => allUsers.add(u)); tMin += o.min; tActs += o.acts; });
  const wk = Array(7).fill(0).map(() => ({ users:0, min:0 }));
  for (const [d, o] of byDay) { const i = dayDate(d).getDay(); wk[i].users += o.users.size; wk[i].min += o.min; }
  const wkMax = Math.max(1, ...wk.map(w => w.users));
  const order = [6, 0, 1, 2, 3, 4, 5];
  return `
    <div class="cards">
      <div class="kpi"><b>${allUsers.size}</b><span>${s.wMany} نشطين</span></div>
      <div class="kpi"><b>${fmtDur(tMin)}</b><span>إجمالي وقت الاستخدام</span></div>
      <div class="kpi"><b>${tActs}</b><span>إجمالي الأنشطة</span></div>
      <div class="kpi"><b>${allUsers.size ? fmtDur(tMin / allUsers.size) : '—'}</b><span>متوسط الوقت للنشط</span></div>
    </div>
    <div class="panel"><h3>👥 عدد النشطين ${weekly ? 'في كل أسبوع' : 'في كل يوم'}</h3>${barChart(usersItems)}</div>
    <div class="panel"><h3>⏱ إجمالي الوقت (بالدقايق) ${weekly ? 'في كل أسبوع' : 'في كل يوم'}</h3>${barChart(minItems)}</div>
    <div class="panel"><h3>📅 النشاط حسب أيام الأسبوع</h3>
      ${order.map(i => `<div class="hb"><span>${WEEKDAYS[i]}</span><div class="tr"><i style="width:${Math.round(wk[i].users / wkMax * 100)}%"></i></div><span>${wk[i].users}</span></div>`).join('')}
      <div class="note">الرقم = مجموع النشطين في اليوم ده خلال الفترة.</div></div>
    <div class="panel"><h3>🧒 حضور المخدومين حسب الفصل</h3>${attendanceBlock(s)}</div>`;
}
function attendanceBlock(s) {

async function loadAttendance(s) {
  const [aDay, bDay] = periodDays(s), weeks = Math.max(1, ((dayDate(bDay) - dayDate(aDay)) / 864e5 + 1) / 7);
  s.att = { loading:true, rows:[], weeks, from:aDay, to:bDay };
  const box = $('#tabbody'); if (box) { /* إعادة رسم الحالة */ }
  try {
    const classes = [...s.classes.values()].filter(c => c.id !== SERVANTS_CLASS_ID && c.id !== 'parents').sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
    const rows = await Promise.all(classes.map(async c => {
      const [st, at] = await Promise.all([
        getCountFromServer(query(collection(s.db, 'students'), where('classSection', '==', c.id))),
        getCountFromServer(query(collection(s.db, 'attendance'), where('classSection', '==', c.id), where('date', '>=', aDay), where('date', '<=', bDay)))
      ]);
      const records = at.data().count;
      return { label:classLabel(s, c.id), students:st.data().count, records, perWeek:records / weeks };
    }));
    s.att = { rows, weeks, from:aDay, to:bDay };
  } catch (e) { console.error(e); s.att = { error:'تعذّر حساب الحضور (' + (e.code || e.message) + ')', rows:[] }; }
  if (cur() === s && s.ui.tab === 'analysis') renderTabBody();

  const all = list.flatMap(s => s.requests.map(v => ({ s, v }))).sort((a, b) => (toDate(b.v.createdAt)?.getTime() || 0) - (toDate(a.v.createdAt)?.getTime() || 0));
  const missing = Object.values(SERVICES).filter(s => !s.admin);
  $('#allbody').innerHTML = (all.length ? `<div class="note" style="margin:0 2px 8px">${all.length} طلب معلّق</div>` + all.map(({ s, v }) => requestCard(s, v, true)).join('') : `<div class="empty">✅ مفيش طلبات انضمام معلّقة</div>`)
    + (missing.length ? `<div class="note">مش داخل في: ${missing.map(s => s.title).join('، ')} — سجّل دخول فيها من الرئيسية عشان تظهر طلباتها هنا.</div>` : '');
}

/* ---------- قبول / رفض / تعديل / حذف ---------- */
async function callWorker(s, path, body) {
  try {
    const t = await s.auth.currentUser.getIdToken();
    const r = await fetch(s.worker + path, { method:'POST', headers:{ 'Authorization':'Bearer ' + t, 'Content-Type':'application/json' }, body:JSON.stringify(body || {}) });
    let data = null; try { data = await r.json(); } catch (_) {}
    return { ok:r.ok, status:r.status, data };
  } catch (e) { console.warn('worker', e); return null; }
}
async function approveReq(s, id) {
  const v = s.requests.find(x => x.id === id); if (!v) return;
  s.ui.busy[id] = true; refreshView();
  try {
    await updateDoc(doc(s.db, 'servants', id), { status:'approved' });
    callWorker(s, '/servant-decision', { targetUid:id, decision:'approved' });
    if (v.name) for (const rid of roleIdsOf(v)) { try { await updateDoc(doc(s.db, 'roles', rid), { pendingNames:arrayRemove(v.name) }); } catch (_) {} }
    toast('تم قبول ' + (v.name || 'الطلب') + ' ✓');
    const mv = s.servants.find(x => x.id === id); if (mv) mv.status = 'approved'; else s.servants.push({ ...v, status:'approved' });
    s.requests = s.requests.filter(x => x.id !== id); s.pending = s.requests.length; s.summary = null;
  } catch (e) { console.error(e); toast('مش مسموحلك تقبل الطلب ده — راجع صلاحيات Firestore', true); }
  delete s.ui.busy[id]; refreshView();
}
async function rejectReq(s, id) {
  const v = s.requests.find(x => x.id === id); if (!v) return;
  if (!confirm('هترفض طلب "' + (v.name || v.email) + '"؟ الحساب هيتمسح.')) return;
  s.ui.busy[id] = true; refreshView();
  try {
    await Promise.race([callWorker(s, '/servant-decision', { targetUid:id, decision:'rejected' }), new Promise(r => setTimeout(r, 4000))]);
    const r = await callWorker(s, '/delete-servant', { targetUid:id });
    let msg = 'تم رفض الطلب';
    if (!(r && r.ok)) { await deleteDoc(doc(s.db, 'servants', id)); msg = 'تم رفض الطلب (اتمسح من الداتا بيز بس — حساب الدخول لسه موجود)'; }
    if (v.name) for (const rid of roleIdsOf(v)) { try { await updateDoc(doc(s.db, 'roles', rid), { pendingNames:arrayUnion(v.name) }); } catch (_) {} }
    toast(msg);
    s.servants = s.servants.filter(x => x.id !== id); s.requests = s.requests.filter(x => x.id !== id); s.pending = s.requests.length;
  } catch (e) { console.error(e); toast('مش مسموحلك ترفض الطلب ده — راجع صلاحيات Firestore', true); }
  delete s.ui.busy[id]; refreshView();
}
function derivePerms(s, list) {
  if (list.some(r => r.isAdmin)) return { role:'admin', assignedClass:'', supervisorClass:'' };
  const all = new Set(), sup = new Set();
  list.forEach(r => (r.classes || []).forEach(c => { all.add(c); if (s.supervisors && r.isSupervisor) sup.add(c); }));
  return { role: sup.size ? 'supervisor' : 'servant', assignedClass:[...all].join(','), supervisorClass:[...sup].join(',') };
}
function closeModal() { const m = $('#modal'); if (m) m.innerHTML = ''; }
function openRolesModal(s, id) {
  const v = s.servants.find(x => x.id === id); if (!v) return;
  const have = new Set(roleIdsOf(v)), roles = [...s.roles.values()].sort((a, b) => String(a.name || '').localeCompare(String(b.name || ''), 'ar'));
  $('#modal').innerHTML = `<div class="ov" data-act="closeModal"><div class="modal" data-keep="1">
    <h3>🎭 أدوار ${esc(v.name || '')}</h3>
    <div class="muted" style="margin-bottom:10px">الصلاحيات والفصول بتتحسب من الأدوار المختارة، زي ما بتحصل جوه البرنامج.</div>
    ${roles.length ? roles.map(r => `<label class="chk"><input type="checkbox" value="${esc(r.id)}" ${have.has(r.id) ? 'checked' : ''}>
      <span><b>${esc(r.name || r.id)}</b>
      <span class="chips">${r.isAdmin ? '<span class="badge acc">أدمن</span>' : ''}${r.isSupervisor ? '<span class="badge warn">مسؤول</span>' : ''}${(r.classes || []).map(c => `<span class="badge">${esc(classLabel(s, c))}</span>`).join('')}</span></span></label>`).join('') : '<div class="empty">مفيش أدوار متعرّفة في البرنامج.</div>'}
    <div class="actions"><button class="btn pri" data-act="saveRoles" data-s="${s.id}" data-id="${esc(id)}">حفظ</button><button class="btn" data-act="closeModal">إلغاء</button></div>
  </div></div>`;
}
async function saveRoles(s, id) {
  const v = s.servants.find(x => x.id === id); if (!v) return;
  const ids = [...document.querySelectorAll('#modal input[type=checkbox]:checked')].map(i => i.value);
  const perms = derivePerms(s, ids.map(i => s.roles.get(i)).filter(Boolean));
  const txt = perms.role === 'admin' ? 'أدمن (كل الفصول)' : `${perms.role === 'supervisor' ? 'مسؤول فصل' : s.wOne} — ${perms.assignedClass ? classIds(perms.assignedClass).map(c => classLabel(s, c)).join('، ') : 'بدون فصل'}`;
  if (!confirm(`هتحفظ الأدوار؟\nالنتيجة: ${txt}`)) return;
  const data = { roleIds:ids, roleId:ids[0] || '', ...perms };
  try { await updateDoc(doc(s.db, 'servants', id), data); Object.assign(v, data); toast('اتحفظت الأدوار ✓'); closeModal(); refreshView(); }
  catch (e) { console.error(e); toast('مش مسموحلك تعدّل — راجع صلاحيات Firestore', true); }
}
async function deleteServant(s, id) {
  const v = s.servants.find(x => x.id === id); if (!v) return;
  if (isPrimary(v.email) || (s.user && s.user.uid === id)) { toast('الحساب ده محمي', true); return; }
  if (!confirm(`هتحذف "${v.name || v.email}"؟ هيتمسح من الداتا بيز وهيفقد صلاحية الدخول.`)) return;
  try {
    const r = await callWorker(s, '/delete-servant', { targetUid:id });
    if (!(r && r.ok)) { await deleteDoc(doc(s.db, 'servants', id)); toast('اتمسح من الداتا بيز (حساب الدخول لسه موجود)'); } else toast('تم الحذف ✓');
    s.servants = s.servants.filter(x => x.id !== id); s.summary = null; s.ui.expanded = null; refreshView();
  } catch (e) { console.error(e); toast('مش مسموحلك تحذف — راجع صلاحيات Firestore', true); }
}

/* ---------- التصدير ---------- */
function exportServants(s) {
  const list = servantsData(s), [a, b] = periodDays(s);
  const rows = [['#', 'الاسم', 'الدور', 'الفصول', 'التليفون', 'الإيميل', 'تاريخ الميلاد', 'عدد الأنشطة', 'مرات الفتح', 'أيام النشاط', 'الوقت (دقيقة)', 'آخر نشاط']];
  list.forEach((v, i) => { const st = statFor(s, v); rows.push([i + 1, v.name, roleLabel(s, v), classesText(s, v), v.phone, v.email, v.dob, st ? st.work : 0, st ? st.opens : 0, st ? st.days : 0, st ? Math.round(st.minutes) : 0, st && st.last ? fmtDateTime(st.last) : '']); });
  downloadCSV(`${s.sub}-${s.wMany}-${a}_${b}.csv`, rows);
}
function exportActs(s) {
  const list = activityData(s), [a, b] = periodDays(s);
  const rows = [['التاريخ', 'الوقت', 'الاسم', 'النشاط', 'التفاصيل']];
  list.forEach(l => rows.push([dayStr(l.ts), fmtTime(l.ts), l.name, l.action, l.detail]));
  downloadCSV(`${s.sub}-الأنشطة-${a}_${b}.csv`, rows);
}

/* ================= الأحداث ================= */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;
  if (a === 'closeModal') { if (el.classList.contains('ov') && e.target.closest('[data-keep]')) return; closeModal(); return; }
  const s = el.dataset.s ? SERVICES[el.dataset.s] : cur();
  if (a === 'goto') { if (!s) return; s.ui.tab = el.dataset.t || 'servants'; s.ui.status = el.dataset.status || ''; s.ui.expanded = null; if (el.dataset.status) { s.ui.sort = 'last'; s.period.preset = '30'; s.usageKey = ''; } go({ v:'svc', s:s.id }); return; }
  if (a === 'setupHelp') { if (s) openSetupModal(s); return; }
  if (a === 'copyRules') { const ok = await copyText(RULES_BLOCK); toast(ok ? 'اتنسخت القاعدة ✓' : 'تعذّر النسخ — انسخها يدويًا من المربع', !ok); return; }
  if (a === 'reset') { e.preventDefault(); return s && doReset(s); }
  if (a === 'open') { if (s) go({ v:'svc', s:s.id }); return; }
  if (a === 'home') { if (state.v === 'home') return; go({ v:'home', s:null }); return; }
  if (a === 'allreq') { go({ v:'allreq', s:null }); return; }
  if (a === 'refresh') {
    if (state.v === 'allreq') { renderAllReq(); return; }
    if (!s) return; s.servantsLoaded = false; s.logsKey = ''; s.usageKey = ''; s.summary = null; s.att = null; renderService(s); return;
  }
  if (!s) return;
  if (a === 'logout') { try { await signOut(s.auth); } catch (_) {} s.user = null; s.admin = false; s.servantsLoaded = false; s.logsKey = ''; s.usageKey = ''; s.pending = null; s.summary = null; go({ v:'home', s:null }); return; }
  if (a === 'tab') { s.ui.tab = el.dataset.t; s.ui.expanded = null; renderService(s); return; }
  if (a === 'applyPeriod') { s.logsKey = ''; s.usageKey = ''; s.att = null; renderService(s); return; }
  if (a === 'toggle') { const id = el.dataset.id; s.ui.expanded = s.ui.expanded === id ? null : id; renderTabBody(); return; }
  if (a === 'viewActs') { s.ui.actServant = el.dataset.id; s.ui.actAction = ''; s.ui.actQ = ''; s.ui.actShown = 200; s.ui.tab = 'activity'; renderService(s); return; }
  if (a === 'moreActs') { s.ui.actShown += 300; $('#listwrap').innerHTML = activityList(s); return; }
  if (a === 'approve') return approveReq(s, el.dataset.id);
  if (a === 'reject') return rejectReq(s, el.dataset.id);
  if (a === 'editRoles') return openRolesModal(s, el.dataset.id);
  if (a === 'saveRoles') return saveRoles(s, el.dataset.id);
  if (a === 'delServant') return deleteServant(s, el.dataset.id);
  if (a === 'exportServants') return exportServants(s);
  if (a === 'exportActs') return exportActs(s);
  if (a === 'loadAtt') { el.disabled = true; el.textContent = 'جاري الحساب…'; return loadAttendance(s); }
});
document.addEventListener('submit', e => {
  if (e.target.closest('[data-form="loginAll"]')) { e.preventDefault(); doLoginAll(); return; }
  const f = e.target.closest('[data-form="login"]'); if (!f) return; e.preventDefault(); const s = cur(); if (s) doLogin(s);
});
document.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.q; if (!k) return;
  const s = cur(); if (!s) return;
  s.ui[k] = e.target.value; s.ui.actShown = 200;
  const w = $('#listwrap'); if (w) w.innerHTML = s.ui.tab === 'servants' ? servantsList(s) : activityList(s);
});
document.addEventListener('change', e => {
  const k = e.target.dataset && e.target.dataset.sel; if (!k) return;
  const s = cur(); if (!s) return;
  if (k.startsWith('p.')) {
    const f = k.slice(2); s.period[f] = e.target.value;
    if (f === 'preset') {
      if (e.target.value === 'custom') {
        if (!s.period.from) { const t = new Date(), f0 = new Date(t.getTime() - 7 * 864e5); s.period.from = toInputDT(f0); s.period.to = toInputDT(t); }
        s.att = null; renderService(s);
      } else { s.logsKey = ''; s.usageKey = ''; s.att = null; renderService(s); }
    }
    return;
  }
  s.ui[k] = e.target.value; s.ui.actShown = 200; s.ui.expanded = null;
  if (s.ui.tab === 'servants') { const w = $('#listwrap'); if (w) w.innerHTML = servantsList(s); else renderTabBody(); } else renderTabBody();
});

/* ================= التشغيل ================= */
(async () => {
  await Promise.race([Promise.all(Object.values(SERVICES).map(watchAuth)), new Promise(r => setTimeout(r, 5000))]);
  const h = history.state;
  if (h && h.v === 'svc' && SERVICES[h.s]) { state.v = 'svc'; state.s = h.s; }
  else if (h && h.v === 'allreq') state.v = 'allreq';
  history.replaceState({ v:state.v, s:state.s }, '');
  render();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(() => {});
})();
window.__dash = { SERVICES, state }; // للاختبار فقط
</script>
